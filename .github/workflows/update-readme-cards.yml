name: Update README Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Pin Card - CornHub
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Kourva&repo=CornHub&bg_color=000000&title_color=D71921&text_color=E0E0E0&icon_color=D71921&border_color=D71921
          path: profile/pin-CornHub.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin Card - FletGrm
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Kourva&repo=FletGrm&bg_color=000000&title_color=D71921&text_color=E0E0E0&icon_color=D71921&border_color=D71921
          path: profile/pin-FletGrm.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin Card - AwesomeChatGPTBot
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Kourva&repo=AwesomeChatGPTBot&bg_color=000000&title_color=D71921&text_color=E0E0E0&icon_color=D71921&border_color=D71921
          path: profile/pin-AwesomeChatGPTBot.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin Card - V2rayDoprax
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Kourva&repo=V2rayDoprax&bg_color=000000&title_color=D71921&text_color=E0E0E0&icon_color=D71921&border_color=D71921
          path: profile/pin-V2rayDoprax.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin Card - DedSecApp
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Kourva&repo=DedSecApp&bg_color=000000&title_color=D71921&text_color=E0E0E0&icon_color=D71921&border_color=D71921
          path: profile/pin-DedSecApp.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pin Card - DoSBoX
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Kourva&repo=DoSBoX&bg_color=000000&title_color=D71921&text_color=E0E0E0&icon_color=D71921&border_color=D71921
          path: profile/pin-DoSBoX.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Kourva&show_icons=true&bg_color=000000&title_color=D71921&text_color=E0E0E0&icon_color=D71921&border_color=D71921&rank_icon=percentile
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Kourva&layout=compact&langs_count=10&bg_color=000000&title_color=D71921&text_color=E0E0E0&border_color=D71921
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile/
          if git diff --cached --quiet; then
            echo "No changes to commit, but checking if profile exists..."
            if [ -d "profile" ] && [ -n "$(ls -A profile/ 2>/dev/null)" ]; then
              echo "Profile folder exists but no changes detected. Files are already up to date."
            else
              echo "Profile folder missing or empty! Forcing commit..."
              git add -f profile/*.svg 2>/dev/null || true
              git commit -m "chore: initialize readme cards" --allow-empty || true
            fi
          else
            git commit -m "chore: update readme cards"
          fi
          git push origin main
