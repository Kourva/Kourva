name: Update README Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Stats Card (Transparent)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Kourva&show_icons=true&bg_color=00000000&title_color=D71921&text_color=E0E0E0&icon_color=D71921&hide_border=true&rank_icon=percentile
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      # Top Languages: Multiple layout variants for you to choose from
      - name: Generate Top Languages (Compact)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Kourva&layout=compact&langs_count=10&bg_color=00000000&title_color=D71921&text_color=E0E0E0&hide_border=true
          path: profile/top-langs-compact.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Top Languages (Donut)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Kourva&layout=donut&langs_count=8&bg_color=00000000&title_color=D71921&text_color=E0E0E0&hide_border=true
          path: profile/top-langs-donut.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Top Languages (Pie)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Kourva&layout=pie&langs_count=8&bg_color=00000000&title_color=D71921&text_color=E0E0E0&hide_border=true
          path: profile/top-langs-pie.svg
          token: ${{ secrets.PAT_TOKEN }}

      # Streak card: Generated using DenverCoder1's Action
      - name: Generate Streak Card (Transparent)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=Kourva&background=00000000&hide_border=true&ring=D71921&fire=D71921&currStreakLabel=D71921&sideLabels=E0E0E0&dates=6B6B6B&stroke=D71921
          path: profile/streak.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update readme cards"
          fi
          git push origin main
